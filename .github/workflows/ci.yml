name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: zsme
          POSTGRES_USER: zsme
          POSTGRES_PASSWORD: zsme-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zsme -d zsme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pip-audit>=2.7,<3"
      - name: Lint
        run: ruff check .
      - name: Compile import surface
        run: python -m compileall -q app
      - name: Migration smoke
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql+psycopg://zsme:zsme-ci-only@localhost:5432/zsme
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict
      - name: Import check
        run: python -c "from app.main import app; assert app.title == 'ZSME Accounting API'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm test -- --project=chromium
      - name: Production build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build API image
        run: docker build --tag zsme-api:test ./backend
      - name: Check Dockerfile syntax
        run: docker build --check ./backend
      - name: Inspect image runtime contract
        run: |
          test "$(docker inspect --format='{{.Config.User}}' zsme-api:test)" = "zsme"
          docker inspect --format='{{json .Config.Healthcheck}}' zsme-api:test | grep -q '/ready'
          test -z "$(docker run --rm --entrypoint sh zsme-api:test -c 'find /app -maxdepth 3 -name ".env*" -print')"
      - name: Scan image and write SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: zsme-api:test
          format: cyclonedx
          output: /tmp/zsme-api.sbom.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zsme-api-sbom
          path: /tmp/zsme-api.sbom.json
          if-no-files-found: error

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare local non-secret configuration
        run: cp backend/.env.compose.example backend/.env.compose
      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env.compose config --quiet
      - name: Validate patch formatting
        run: git diff --check
