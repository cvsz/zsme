services:
  api:
    build:
      context: ./backend
    ports:
      - "${ZSME_API_PORT:-18081}:8000"
    env_file:
      - ./backend/.env.compose
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://zsme:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env.compose}@db:5432/${POSTGRES_DB:-zsme}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in backend/.env.compose}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  db:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env.compose
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zsme}
      POSTGRES_USER: ${POSTGRES_USER:-zsme}
    volumes:
      - zsme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zsme_pgdata:
